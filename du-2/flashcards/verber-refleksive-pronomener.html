<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dansk Flashcard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Beige bagside som foreskrevet */
        .bg-beige {
            background-color: #f5f0eb;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <div class="w-full max-w-lg mx-auto flex-1 flex flex-col justify-center items-center my-auto">
        
        <!-- Header & Sprogvelger -->
        <header class="w-full mb-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-4">Lær Danske Verber</h1>
            
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-200">
                <label for="languageSelect" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1 text-left">
                    Vælg Målsprog:
                </label>
                <select id="languageSelect" class="w-full p-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm sm:text-base rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none cursor-pointer">
                    <!-- Sprogmuligheder oprettes dynamisk via JS -->
                </select>
            </div>
        </header>

        <!-- Statuslinje -->
        <div id="statusContainer" class="w-full flex justify-between items-center mb-4 px-1 text-sm font-medium text-gray-600">
            <span>Status:</span>
            <span id="cardsCount" class="bg-blue-100 text-blue-800 text-xs sm:text-sm font-semibold px-3 py-1 rounded-full">
                Kort tilbage: 8
            </span>
        </div>

        <!-- Flashcard Område -->
        <div id="gameScreen" class="w-full flex flex-col items-center">
            
            <!-- Card Container -->
            <div class="w-full h-64 sm:h-72 perspective-1000 cursor-pointer" id="cardContainer">
                <div id="cardInner" class="relative w-full h-full transform-style-3d card-inner rounded-2xl shadow-lg">
                    
                    <!-- Forside (Dansk): Hvid baggrund, sort skrift -->
                    <div class="absolute w-full h-full backface-hidden bg-white text-gray-900 border border-gray-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center select-none">
                        <span class="text-xs uppercase tracking-widest font-semibold text-gray-400 mb-3">Dansk</span>
                        <p id="cardFrontText" class="text-2xl sm:text-3xl font-bold text-gray-800">at vaske sig</p>
                        <span class="text-xs text-gray-400 mt-6 animate-pulse">Klik for at se oversættelsen ↻</span>
                    </div>

                    <!-- Bagside (Målsprog): Beige baggrund, sort skrift -->
                    <div class="absolute w-full h-full backface-hidden bg-beige text-gray-900 border border-amber-200/60 rounded-2xl p-6 flex flex-col items-center justify-center text-center rotate-y-180 select-none">
                        <span id="targetLangLabel" class="text-xs uppercase tracking-widest font-semibold text-amber-800/60 mb-3">Oversættelse</span>
                        <p id="cardBackText" class="text-xl sm:text-2xl font-bold text-gray-900">wash oneself</p>
                    </div>

                </div>
            </div>

            <!-- Interaktionsknapper (Kun synlige når kortet er vendt) -->
            <div id="buttonGroup" class="w-full grid grid-cols-2 gap-4 mt-6 opacity-0 pointer-events-none transition-opacity duration-300">
                <button id="wrongBtn" class="w-full py-3.5 px-4 bg-red-500 hover:bg-red-600 active:scale-95 text-white font-semibold rounded-xl shadow-md transition-all duration-150 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    Forkert
                </button>
                <button id="correctBtn" class="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-semibold rounded-xl shadow-md transition-all duration-150 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Rigtigt
                </button>
            </div>

        </div>

        <!-- Færdig Skærm -->
        <div id="finishScreen" class="hidden w-full bg-white border border-gray-200 rounded-2xl p-8 shadow-lg text-center flex flex-col items-center">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mb-4">
                🎉
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Flot klaret!</h2>
            <p class="text-gray-600 mb-6">Du har lært alle ordene i denne runde.</p>
            <button id="restartBtn" class="w-full sm:w-auto px-8 py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold rounded-xl shadow-md transition-all duration-150">
                Start forfra
            </button>
        </div>

    </div>

                    hi: "विकसित होना",
                    ur: "ترقی کرنا",
                    uk: "розвиватися",
                    ru: "развиваться",
                    fa: "توسعه یافتن, پیشرفت کردن",
                    tr: "gelişmek",
                    ku: "geşbûn, pêşketin",
                    ckb: "گەشەکردن",
                    ne: "विकास हुनु",
                    sw: "kuendelea, kukua",
                    fr: "se développer, évoluer",
                    ak: "nya nkoso",
                    bs: "razvijati se",
                    so: "horumarin",
                    sr: "развијати се",
                    ti: "ምዕባለ",
                    zh: "发展, 演变",
                    tg: "инкишоф ёфтан",
                    es: "desarrollarse, evolucionar",

                    lt: "vystytis, tobulėti",
                    id: "berkembang"
                }
            }
        ];

        // App State
        let currentDeck = [];
        let currentCardIndex = 0;
        let selectedLanguage = "en";
        let isFlipped = false;
        let isTransitioning = false;

        // DOM Elementer
        const languageSelect = document.getElementById("languageSelect");
        const cardsCountEl = document.getElementById("cardsCount");
        const cardContainer = document.getElementById("cardContainer");
        const cardInner = document.getElementById("cardInner");
        const cardFrontText = document.getElementById("cardFrontText");
        const cardBackText = document.getElementById("cardBackText");
        const targetLangLabel = document.getElementById("targetLangLabel");
        const buttonGroup = document.getElementById("buttonGroup");
        const correctBtn = document.getElementById("correctBtn");
        const wrongBtn = document.getElementById("wrongBtn");
        const gameScreen = document.getElementById("gameScreen");
        const finishScreen = document.getElementById("finishScreen");
        const restartBtn = document.getElementById("restartBtn");

        // Initialiser sprogvelger
        function initLanguageSelect() {
            languageSelect.innerHTML = "";
            LANGUAGES.forEach(lang => {
                const option = document.createElement("option");
                option.value = lang.code;
                option.textContent = lang.name;
                languageSelect.appendChild(option);
            });
            languageSelect.value = selectedLanguage;
        }

        // Start / Nulstil spillet
        function initGame() {
            currentDeck = [...WORDS];
            // Bland bunken for variation
            currentDeck.sort(() => Math.random() - 0.5);
            currentCardIndex = 0;
            isFlipped = false;
            isTransitioning = false;

            gameScreen.classList.remove("hidden");
            finishScreen.classList.add("hidden");

            updateCardContent();
            updateUIState();
        }

        // Opdater teksten på kortet baseret på den nuværende tilstand
        function updateCardContent() {
            if (currentDeck.length === 0) return;
            const currentWord = currentDeck[currentCardIndex];
            cardFrontText.textContent = currentWord.da;
            cardBackText.textContent = currentWord.translations[selectedLanguage] || "Ingen oversættelse";
            
            const currentLangName = LANGUAGES.find(l => l.code === selectedLanguage)?.name || "Målsprog";
            targetLangLabel.textContent = `Oversættelse (${currentLangName})`;
        }

        // Opdater visualisering og knapper
        function updateUIState() {
            cardsCountEl.textContent = `Kort tilbage: ${currentDeck.length}`;

            if (isFlipped) {
                cardInner.classList.add("rotate-y-180");
                buttonGroup.classList.remove("opacity-0", "pointer-events-none");
            } else {
                cardInner.classList.remove("rotate-y-180");
                buttonGroup.classList.add("opacity-0", "pointer-events-none");
            }
        }

        // Flip kortet ved klik
        function flipCard() {
            if (isTransitioning || currentDeck.length === 0) return;
            isFlipped = !isFlipped;
            updateUIState();
        }

        // Håndter svar ("Rigtigt" eller "Forkert") med isTransitioning timing
        function handleAnswer(isCorrect) {
            if (isTransitioning || !isFlipped) return;

            isTransitioning = true;
            
            // 1. Vender kortet tilbage til forsiden (Dansk)
            isFlipped = false;
            updateUIState();

            // 2. Venter ca. 400ms før opdatering af teksten for ikke at afsløre svaret for tidligt
            setTimeout(() => {
                if (isCorrect) {
                    // Fjern ordet fra bunken
                    currentDeck.splice(currentCardIndex, 1);
                    if (currentCardIndex >= currentDeck.length) {
                        currentCardIndex = 0;
                    }
                } else {
                    // Bliver i bunken og flyttes om bag i runden
                    const failedWord = currentDeck.splice(currentCardIndex, 1)[0];
                    currentDeck.push(failedWord);
                }

                // Tjek om alle kort er lært
                if (currentDeck.length === 0) {
                    gameScreen.classList.add("hidden");
                    finishScreen.classList.remove("hidden");
                    cardsCountEl.textContent = "Kort tilbage: 0";
                } else {
                    updateCardContent();
                    updateUIState();
                }

                isTransitioning = false;
            }, 400);
        }

        // Event Listeners
        cardContainer.addEventListener("click", flipCard);
        
        correctBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            handleAnswer(true);
        });

        wrongBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            handleAnswer(false);
        });

        languageSelect.addEventListener("change", (e) => {
            selectedLanguage = e.target.value;
            updateCardContent();
        });

        restartBtn.addEventListener("click", () => {
            initGame();
        });

        // Start applikationen ved indlæsning
        window.addEventListener("DOMContentLoaded", () => {
            initLanguageSelect();
            initGame();
        });
    </script>
</body>
</html>
